[project]
name = "clockwork_sim"
version = "0.0.1"
description = "Educational, cycle-accurate hardware simulation in pure Python: modules, latency-typed signals and clocks, simulated cycle by cycle, traced and visualized."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ari-ben" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
# The simulation core depends on the standard library only (requirements-core § 4.1).
# Enforced by tests/test_dependencies.py.
dependencies = []

[project.optional-dependencies]
# Tabular trace views.
analysis = ["pandas>=2.2"]
# Waveform export (VCD). WaveDrom export needs no extra package.
export = ["pyvcd>=0.4"]
# Command-line examples.
examples = ["typer>=0.12", "rich>=13"]
all = ["clockwork_sim[analysis,export,examples]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pyright>=1.1.380",
    "ruff>=0.8",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clockwork_sim"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["clockwork_sim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
# Target deliberately not fixed yet (testing.md § 6); set once there is real data.

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "TID",      # tidy imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
